apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: remember-this
  namespace: remember-this
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: default-collection@kubernetescrd
spec:
  rules:
  - host: remember-this.nuc.one
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: remember-this
            port:
              number: 8000
