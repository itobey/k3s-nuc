apiVersion: v1
kind: PersistentVolume
metadata:
  name: remember-this-pv
  labels:
    type: local
spec:
  storageClassName: remember-this-pv
  capacity:
    storage: 1Gi
  accessModes:
  - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  claimRef:
    name: remember-this-pvc
    namespace: remember-this
  hostPath:
    path: /media/enc/docker-volumes/remember-this
    type: Directory
