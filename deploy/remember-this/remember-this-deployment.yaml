apiVersion: apps/v1
kind: Deployment
metadata:
  name: remember-this
  namespace: remember-this
  labels:
    app: remember-this
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: remember-this
  template:
    metadata:
      labels:
        app: remember-this
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      imagePullSecrets:
        - name: ghcr-pull-secret
      containers:
      - name: remember-this
        image: ghcr.io/itobey/remember-this:0.6
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 8000
        env:
        - name: HOST
          value: 0.0.0.0
        - name: PORT
          value: '8000'
        - name: POSITIVES_PATH
          value: /data/positives.json
        volumeMounts:
        - name: data
          mountPath: /data
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 25m
            memory: 32Mi
          limits:
            cpu: 250m
            memory: 128Mi
        readinessProbe:
          httpGet:
            path: /readyz
            port: http
          initialDelaySeconds: 2
        livenessProbe:
          httpGet:
            path: /healthz
            port: http
          initialDelaySeconds: 5
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: remember-this-pvc
      automountServiceAccountToken: false
