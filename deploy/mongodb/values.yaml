mongodb:
  # Bitnami pulled all free container images from `docker.io/bitnami` in Aug 2025 and
  # mirrored a frozen snapshot to `docker.io/bitnamilegacy`. The revision this chart
  # pins by default, bitnami/mongodb:4.4.13-debian-10-r52, predates that snapshot and
  # is now gone from BOTH orgs - it only survives in this node's containerd cache, so
  # the pod would ImagePullBackOff on any reschedule to a clean node.
  #
  # bitnamilegacy still carries the unsuffixed 4.4.13 tag, which is the same MongoDB
  # version (still required: this NUC has no AVX, so 5.0+ will not run). The digest is
  # appended so we resolve by content and not by a floating tag; the chart renders the
  # image as "<registry>/<repository>:<tag>", and "4.4.13@sha256:..." is a valid
  # reference in that position.
  image:
    repository: bitnamilegacy/mongodb
    tag: "4.4.15@sha256:916202d7af766dd88c2fff63bf711162c9d708ac7a3ffccd2aa812e3f03ae209"

  architecture: standalone

  replicaCount: 1

  auth:
    usernames:
    - fddb
    databases:
    - fddb
    existingSecret: mongodb-auth-secret

  arbiter:
    enabled: false

  persistence:
    existingClaim: mongodb-pvc

  service:
    type: NodePort
    #externalTrafficPolicy: Cluster

  externalAccess:
    enabled: false

  pdb:
    create: false

  rbac:
    create: false

  serviceAccount:
    create: false

  networkPolicy:
    enabled: false

# unfortunately necessary, as the readiness probe fails all the time because the command to grep is too slow to return true
  readinessProbe:
    enabled: false
# unfortunately necessary, as the liveness probe results in very high cpu load. with cpu limits it crashes the pod
  livenessProbe:
    enabled: false

  resources:
    limits:
      cpu: 200m