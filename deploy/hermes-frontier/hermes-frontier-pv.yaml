apiVersion: v1
kind: PersistentVolume
metadata:
  name: hermes-frontier-pv
  labels:
    type: local
spec:
  storageClassName: hermes-frontier-pv
  capacity:
    storage: 10Gi
  accessModes:
  - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  claimRef:
    name: hermes-frontier-pvc
    namespace: hermes-frontier
  hostPath:
    path: /media/enc/docker-volumes/hermes-frontier
    type: Directory
