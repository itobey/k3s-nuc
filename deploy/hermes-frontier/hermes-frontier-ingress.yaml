apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hermes-frontier-dashboard
  namespace: hermes-frontier
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  ingressClassName: traefik
  rules:
  - host: hermes-frontier.nuc.one
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: hermes-frontier-dashboard
            port:
              name: dashboard
  - host: hermes-frontier-webapp.nuc.one
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: hermes-frontier-dashboard
            port:
              name: webapp
