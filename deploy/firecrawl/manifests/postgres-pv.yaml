apiVersion: v1
kind: PersistentVolume
metadata:
  name: firecrawl-postgres-pv
  labels:
    type: local
spec:
  storageClassName: firecrawl-postgres-pv
  capacity:
    storage: 10Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  claimRef:
    name: firecrawl
    namespace: firecrawl
  hostPath:
    path: /media/enc/docker-volumes/firecrawl-postgres
    type: Directory
