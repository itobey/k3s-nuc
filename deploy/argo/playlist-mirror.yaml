apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: playlist-mirror
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/itobey/k3s-nuc.git
    targetRevision: HEAD
    path: deploy/playlist-mirror
  destination:
    server: https://kubernetes.default.svc
    namespace: playlist-mirror
  syncPolicy:
    syncOptions:
    - CreateNamespace=true
